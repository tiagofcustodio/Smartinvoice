Isto é totalmente possível fazer em Django (até encaixa no teu perfil 👀).
Podia ter:
Upload de faturas
OCR com Tesseract ou API
Sistema de categorias
Plano de contas
Lançamentos automáticos
Exportação SAFT

Objetivo do MVP
Criar uma aplicação desktop (Tkinter) que:
Permite upload de faturas (imagem ou PDF)
Extrai dados automaticamente (OCR)
Reconhece fornecedor e categoria
Permite confirmar/ajustar dados
Gera lançamento contabilístico automático (débito/crédito)
Permite exportar ficheiro tipo SAFT (versão simplificada)
