task

1. Digitalizar faturas
Ela quer que a pessoa:
Pegue numa fatura (ex: da Galp)
Tire foto ou faça upload do PDF
O sistema leia automaticamente os dados da fatura (fornecedor, valor, data, NIF, etc.)
Isto chama-se:
🔎 OCR (Reconhecimento Ótico de Caracteres)
📌 2. Reconhecimento automático do fornecedor
O programa deve:
Reconhecer que "Galp" = fornecedor de combustível
Classificar automaticamente como categoria: Combustível
Ou seja:
Ter uma base de dados onde:
Galp → Combustível
Continente → Supermercado
NOS → Telecomunicações
📌 3. Pergunta gasolina ou gasóleo
Depois de reconhecer como combustível, o sistema mostra:
⛽ Gasolina
🚛 Gasóleo
Se a pessoa escolher "Gasolina", o sistema faz o lançamento contabilístico automaticamente.
📌 4. Lançamento automático na contabilidade
Ela falou:
“lança a fatura a débito e a crédito a caixa”
Isto é contabilidade normal:
Exemplo: Se for uma fatura de 100€ de gasolina paga em dinheiro:
Conta
Débito
Crédito
Combustível
100€

Caixa

100€
Ou seja:
Débito → despesa combustível
Crédito → sai dinheiro da caixa
O programa faria isso sozinho.
💡 Resumindo o que ela quer:
Ela quer um sistema que:
📷 Digitaliza faturas
🤖 Reconhece automaticamente o fornecedor
📂 Classifica por categoria
❓ Permite escolher subcategoria (gasolina/gasóleo)
📊 Faz lançamento contabilístico automático
