<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartInvoice - Envio de Fatura</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f5f7;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        h1 { font-size: 24px; color: #333; margin-bottom: 20px; }
        .upload-btn-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
            margin-bottom: 20px;
        }
        .btn {
            border: 2px solid #007aff;
            color: #007aff;
            background-color: white;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            display: block;
            width: 100%;
            box-sizing: border-box;
            cursor: pointer;
        }
        .btn:hover { background-color: #f0f8ff; }
        .upload-btn-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
            height: 100%;
        }
        .submit-btn {
            background-color: #007aff;
            color: white;
            border: none;
            padding: 15px 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            box-sizing: border-box;
        }
        .submit-btn:hover { background-color: #0056b3; }
        .flash {
            background-color: #d4edda;
            color: #155724;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📸 Digitalizar Fatura</h1>
        
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="flash">
            {% for message in messages %}
              {{ message }}
            {% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        <form action="{{ url_for('upload_file') }}" method="post" enctype="multipart/form-data">
            <input type="hidden" name="token" value="{{ token }}">
            
            <div class="upload-btn-wrapper">
                <button type="button" class="btn" id="fileBtn">Tirar Foto / Escolher</button>
                <!-- O "capture=environment" aciona diretamente a câmara no smartphone -->
                <input type="file" name="file" accept="image/*,application/pdf" capture="environment" onchange="document.getElementById('fileBtn').innerText = this.files[0].name" required>
            </div>
            
            <button type="submit" class="submit-btn">Enviar para o Computador</button>
        </form>
    </div>
</body>
</html>
